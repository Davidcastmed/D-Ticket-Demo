<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#081C15"/>
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F5E9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#74C69D"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#52B788" stroke-width="6" opacity="0.3"/>

  <!-- Speed lines in background -->
  <path d="M 64 220 L 140 220" stroke="#52B788" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  <path d="M 40 256 L 120 256" stroke="#74C69D" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M 70 292 L 135 292" stroke="#52B788" stroke-width="12" stroke-linecap="round" opacity="0.4"/>

  <!-- Train Front Silhouette -->
  <g transform="translate(140, 100)">
    <!-- Main Train Body -->
    <path d="M 40 40 
             C 40 10, 192 10, 192 40 
             L 212 180 
             C 212 250, 20 250, 20 180 
             Z" 
          fill="url(#trainGrad)" 
          filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.4))"/>

    <!-- Windshield (dark green cockpit) -->
    <path d="M 52 50 
             C 52 35, 180 35, 180 50 
             L 190 110 
             C 190 130, 42 130, 42 110 
             Z" 
          fill="#1B4332"/>

    <!-- Windshield glass reflection -->
    <path d="M 60 55 L 110 55 L 85 110 L 52 110 Z" fill="#52B788" opacity="0.35"/>

    <!-- Deutschlandticket Signature Ribbon -->
    <rect x="25" y="145" width="182" height="24" rx="4" fill="url(#accentGrad)"/>
    
    <!-- Train Front Grille / Destination Badge -->
    <rect x="80" y="24" width="72" height="14" rx="3" fill="#1B4332"/>
    <text x="116" y="34" fill="#74C69D" font-family="Arial, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">D-TICKET</text>

    <!-- Headlights -->
    <circle cx="50" cy="195" r="14" fill="#FFF" stroke="#E6DED6" stroke-width="3"/>
    <circle cx="50" cy="195" r="8" fill="#FFF9C4"/>
    <circle cx="182" cy="195" r="14" fill="#FFF" stroke="#E6DED6" stroke-width="3"/>
    <circle cx="182" cy="195" r="8" fill="#FFF9C4"/>

    <!-- Center High Beam -->
    <circle cx="116" cy="165" r="7" fill="#FFFFFF"/>

    <!-- Lower Bumper / Coupling -->
    <rect x="86" y="235" width="60" height="20" rx="6" fill="#081C15"/>
    <circle cx="116" cy="245" r="5" fill="#4E342E"/>
  </g>

  <!-- Rails under train -->
  <g stroke="#52B788" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <line x1="160" y1="380" x2="352" y2="380"/>
    <line x1="120" y1="420" x2="392" y2="420"/>
  </g>
  <g stroke="#74C69D" stroke-width="8" stroke-linecap="round" opacity="0.7">
    <line x1="200" y1="365" x2="175" y2="440"/>
    <line x1="312" y1="365" x2="337" y2="440"/>
  </g>

  <!-- D-Ticket Badge in Bottom Corner -->
  <g transform="translate(350, 360)">
    <circle cx="50" cy="50" r="42" fill="#52B788" stroke="#FFFFFF" stroke-width="4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.3))"/>
    <text x="50" y="58" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle">D</text>
  </g>
</svg>
